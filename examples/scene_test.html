<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />

<script src="https://cdn.jsdelivr.net/npm/eventemitter3@5.0/dist/eventemitter3.umd.min.js"></script>
<script src="js/roslib.js"></script>
<script src="../build/ros3d.js"></script>

<script>
  /**
   * Setup all visualization elements when the page is loaded.
   */
  var objects = {};
  function init() {
    // Connect to ROS.
    var ros = new ROSLIB.Ros({
      url : 'ws://localhost:9090'
    });

    // Create the main viewer.
    var viewer = new ROS3D.Viewer({
      divID : 'urdf',
      width : 800,
      height : 600,
      antialias : true,
      intensity : 0.7
    });

    viewer.addObject(new ROS3D.Grid());

    // Setup a client to listen to TFs.
    var tfClient = new ROSLIB.TFClient({
      ros : ros,
      angularThres : 0.001,
      transThres : 0.001,
      rate : 10.0
    });

    // Setup a client to listen to TFs.
    var sceneClient = new ROS3D.SceneClient({
      ros : ros,
      tfClient : tfClient,
      rootObject : viewer.scene,
    });

    var urdfClient = new ROS3D.UrdfClient({
      ros : ros,
      tfClient : tfClient,
      path : 'http://0.0.0.0/data',
      rootObject : viewer.scene,
    });
  }
</script>
</head>

<body onload="init()">
  <h1>Web RViz</h1>
  <p>Run the lining as usual with RViz and run the following commands: (then refresh the page)</p>
  <ol>
    <li><tt>roslaunch rosbridge_server rosbridge_websocket.launch</tt></li>
    <li><tt>rosrun joint_state_publisher joint_state_publisher</tt></li>
    <li><tt>rosrun tf2_web_republisher tf2_web_republisher</tt></li>
  </ol>
  <div id="urdf"></div>
</body>
</html>
